services:
    postgres:
        image: postgres:16-alpine
        ports:
            - '5432:5432'
        environment:
            POSTGRES_DB: kemet
            POSTGRES_USER: kemet
            POSTGRES_PASSWORD: kemet
        volumes:
            - kemet-postgres:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U kemet -d kemet']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'
        volumes:
            - kemet-redis:/data

volumes:
    kemet-postgres:
    kemet-redis:
